<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coartada 3D · COARTADA — Misterios de lógica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600;700&family=Bangers&family=Special+Elite&family=Cinzel:wght@600;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#07061a; --bg1:#120f3a; --ink:#f4f1ff; --mut:#a9a4d6;
  --rojo:#e3172f; --rojo2:#a80d21; --rojo3:#ff5468;
  --lcd:#0d1f1c; --lcd2:#12302a; --fosforo:#7dffb0;
  --oro:#ffd23f; --cian:#4be3ff; --wall:#1d1933;
  --pix:'Press Start 2P', ui-monospace, monospace;
  --txt:'Chakra Petch', system-ui, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--txt);color:var(--ink);overflow-x:hidden;
  background:
    radial-gradient(1200px 700px at 12% -10%, #3a1b6e 0%, transparent 60%),
    radial-gradient(900px 600px at 105% 20%, #0b4a6b 0%, transparent 55%),
    radial-gradient(900px 700px at 50% 120%, #5a1030 0%, transparent 60%),
    linear-gradient(160deg,var(--bg0),var(--bg1));
  background-attachment:fixed;
}
#cielo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.2;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.pantalla{position:relative;z-index:1;min-height:100vh;display:none;padding:20px 16px 40px}
.pantalla.on{display:block}

/* ================= PORTADA ================= */
#home{max-width:1100px;margin:0 auto;text-align:center}
.sello{display:inline-flex;gap:8px;align-items:center;font:600 12px var(--txt);letter-spacing:.32em;text-transform:uppercase;color:var(--cian);margin-top:5vh;opacity:.9}
.sello i{width:8px;height:8px;border-radius:50%;background:var(--rojo3);box-shadow:0 0 12px var(--rojo3);animation:latido 1.6s infinite}
@keyframes latido{50%{opacity:.25}}
.logo{font:400 clamp(34px,9.4vw,104px)/1 var(--pix);margin:22px 0 10px;letter-spacing:-.02em;color:#fff;position:relative;display:inline-block;
  text-shadow:.045em .045em 0 var(--rojo), -.03em -.03em 0 var(--cian), 0 0 60px rgba(255,80,120,.55)}
.logo span{display:inline-block;animation:brinco 3.2s cubic-bezier(.3,1.6,.5,1) infinite;animation-delay:calc(var(--i)*90ms)}
@keyframes brinco{0%,82%,100%{transform:none}88%{transform:translateY(-.14em) rotate(-3deg)}94%{transform:translateY(.03em)}}
.logo .lupa{position:absolute;right:-.5em;top:-.42em;width:.9em;height:.9em;animation:lupa 6s ease-in-out infinite}
@keyframes lupa{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-5.6em,.5em) rotate(-18deg)}}
.lema{font-size:clamp(15px,2.3vw,20px);color:var(--mut);margin:14px auto 34px;max-width:620px}
.lema b{color:var(--oro);font-weight:600}
.mundo{position:relative;text-align:left;border-radius:28px;padding:26px;overflow:hidden;
  background:linear-gradient(135deg,#e3172f 0%,#b10f24 46%,#6d0a1a 100%);
  box-shadow:0 30px 80px -20px rgba(227,23,47,.6), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -8px 0 rgba(0,0,0,.25)}
.mundo::before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,transparent 0 26%,rgba(255,255,255,.14) 26% 30%,transparent 30% 100%),
  linear-gradient(180deg,rgba(255,255,255,.13) 0 47%,rgba(0,0,0,.25) 47% 53%,rgba(255,255,255,.05) 53%);animation:gira 40s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.mundo-cab{display:flex;align-items:center;gap:16px;position:relative;flex-wrap:wrap}
.lente{width:62px;height:62px;border-radius:50%;flex:none;border:5px solid #fff;
  background:radial-gradient(circle at 32% 28%,#fff 0 9%,#9ff 10% 18%,#19b6ff 34%,#0647a8 78%);
  box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 30px #35c8ff;animation:pulso 2.4s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 55px 8px #35c8ff}}
.mundo h2{font:400 clamp(15px,2.6vw,24px)/1.3 var(--pix);margin:0;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
.mundo small{display:block;font:600 12px var(--txt);letter-spacing:.28em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.elenco{display:flex;margin-left:auto}
.elenco .ficha{width:50px;height:50px;margin-left:-10px;animation:flota 3s ease-in-out infinite;animation-delay:calc(var(--i)*-.5s)}
@keyframes flota{50%{transform:translateY(-7px)}}
.casos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:22px;position:relative}
.cart{position:relative;border-radius:14px 14px 18px 18px;padding:14px 14px 16px;text-align:left;min-height:150px;cursor:pointer;
  background:linear-gradient(180deg,#fff7e0,#ffd98a);color:#2a1830;box-shadow:inset 0 2px 0 #fff,0 8px 0 rgba(0,0,0,.35),0 14px 24px rgba(0,0,0,.35);transition:transform .18s, box-shadow .18s}
.cart::before{content:"";position:absolute;left:14px;right:14px;top:0;height:7px;border-radius:0 0 6px 6px;background:repeating-linear-gradient(90deg,#15132a 0 6px,#4d4870 6px 9px)}
.cart .n{font:400 10px var(--pix);color:#c2152b;margin-top:10px;display:flex;justify-content:space-between}
.cart .n em{font-style:normal;color:#7a5a2a}
.cart .t{font:700 17px/1.15 var(--txt);margin:8px 0 4px}
.cart .l{font-size:12px;opacity:.7;margin-bottom:10px;line-height:1.2;padding-right:4px}
.cart .d{display:flex;gap:4px}
.cart .d i{width:11px;height:11px;border-radius:50%;background:rgba(0,0,0,.14)}
.cart .d i.s{background:#e3172f}
.cart:hover{transform:translateY(-6px) rotate(-1.2deg);box-shadow:inset 0 2px 0 #fff,0 14px 0 rgba(0,0,0,.35),0 26px 34px rgba(0,0,0,.45)}
.cart .est{position:absolute;right:11px;bottom:12px;font:400 8px var(--pix);padding:6px 7px 5px;border-radius:6px;background:#2a1830;color:#fff}
.cart .est.curso{background:#2238b8}
.cart .est.hecho{background:#0a7a3d;font-size:11px;letter-spacing:2px}
.cart .est.visto{background:#7a5a2a}
.cart.hecho{background:linear-gradient(180deg,#e9ffe9,#a8e8b4)}
.proximos{margin-top:34px;text-align:left}
.proximos h3{font:400 11px var(--pix);color:var(--mut);letter-spacing:.08em;margin:0 0 14px}
.proximos div{display:flex;gap:12px;flex-wrap:wrap}
.proximos span{flex:1 1 170px;min-height:84px;border-radius:16px;border:2px dashed rgba(255,255,255,.22);display:grid;place-items:center;text-align:center;padding:10px;
  font:600 16px var(--txt);color:rgba(255,255,255,.6);background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(255,255,255,.01))}
.proximos span small{display:block;font:400 7px var(--pix);color:var(--cian);margin-top:7px;opacity:.8}
.pie{margin-top:30px;font-size:12px;color:rgba(255,255,255,.35)}

.audio{position:fixed;right:12px;top:10px;z-index:30;display:flex;gap:8px;align-items:center}
.vol{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 8px;border-radius:18px;background:rgba(20,16,44,.78);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);cursor:pointer}
.vol span{font-size:15px;width:18px;text-align:center}
.vol input{width:84px;accent-color:#ffd23f;cursor:pointer}
@media (max-width:700px){.vol input{width:62px}}
.mini{width:38px;height:38px;border-radius:50%;background:#2a2740;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.5);font-size:16px;display:grid;place-items:center;position:relative}
.mini:active{transform:translateY(2px)}
.mini.off{opacity:.6}
.mini.off::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:3px;background:#ff5468;transform:rotate(-45deg);border-radius:2px}

/* ================= DISPOSITIVO ================= */
#juego{padding:8px 10px 20px}
.dex{
  --n:6; --cell:max(36px, calc(min(100vh - 236px, 100vw - 470px) / var(--n)));
  width:fit-content;max-width:100%;margin:0 auto;border-radius:26px 26px 30px 30px;padding:0 0 14px;position:relative;
  background:linear-gradient(175deg,#f02a41 0%,var(--rojo) 30%,var(--rojo2) 100%);
  box-shadow:0 40px 100px -30px rgba(0,0,0,.9),0 0 0 3px #6b0715, inset 0 3px 0 rgba(255,255,255,.4), inset 0 -10px 0 rgba(0,0,0,.22);
}
.dex-top{display:flex;align-items:center;gap:12px;padding:9px 112px 10px 16px;border-bottom:4px solid #6b0715;box-shadow:0 5px 0 rgba(255,255,255,.14)}
.dex-top .lente{width:42px;height:42px;border-width:4px}
.leds{display:flex;gap:6px;align-self:flex-start;margin-top:2px}
.leds i{width:11px;height:11px;border-radius:50%;border:2px solid rgba(0,0,0,.35)}
.leds i:nth-child(1){background:#ff5468}.leds i:nth-child(2){background:#ffd23f;animation:latido 2s infinite}.leds i:nth-child(3){background:#5cf08a}
.dex-tit{flex:1;min-width:0}
.dex-tit small{font:600 10.5px var(--txt);letter-spacing:.22em;text-transform:uppercase;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex-tit h1{font:400 clamp(10px,1.5vw,15px)/1.35 var(--pix);margin:4px 0 0;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.reloj{font:400 12px var(--pix);background:#16302a;color:var(--fosforo);padding:9px 9px 7px;border-radius:8px;box-shadow:inset 0 2px 6px #000,0 2px 0 rgba(255,255,255,.3);text-shadow:0 0 8px var(--fosforo)}
.dex-top .mini{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #6b0715}

.dex-cuerpo{display:grid;grid-template-columns:auto 20px 318px;padding:12px 16px 0;align-items:stretch}
.bisagra{background:linear-gradient(90deg,#7a0a19,#c9142b 40%,#7a0a19);border-radius:6px;margin:0 5px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2);position:relative}
.bisagra::before,.bisagra::after{content:"";position:absolute;left:0;right:0;height:5px;background:rgba(0,0,0,.35)}
.bisagra::before{top:16%}.bisagra::after{bottom:16%}
.marco{background:linear-gradient(180deg,#f1f0f6,#c9c7d6);padding:8px 12px 22px 6px;border-radius:14px 14px 14px 40px;position:relative;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 4px 0 rgba(0,0,0,.25);width:max-content;max-width:100%;margin:0 auto}
.marco::after{content:"";position:absolute;left:34px;bottom:6px;width:11px;height:11px;border-radius:50%;background:#e3172f;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.norte{position:absolute;right:14px;bottom:5px;font:400 7px var(--pix);color:#55506e}
.plano{display:grid;grid-template-columns:18px auto;grid-template-rows:16px auto}
.coordC{grid-column:2;display:grid;grid-template-columns:repeat(var(--n),var(--cell));padding:0 4px;font:400 8px var(--pix);color:#55506e;text-align:center;align-items:center}
.coordF{display:grid;grid-template-rows:repeat(var(--n),var(--cell));padding:4px 0;font:400 8px var(--pix);color:#55506e;align-items:center;justify-items:center}
.tablero{display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));
  border:4px solid var(--wall);border-radius:6px;overflow:hidden;position:relative;background:var(--wall);box-shadow:0 0 0 3px #45415f, 0 0 40px rgba(75,227,255,.25)}
.celda{position:relative;overflow:hidden;cursor:pointer;user-select:none}
.celda>*{position:absolute;inset:0;pointer-events:none}
.celda .muros{z-index:3}
.celda .obj{z-index:2;padding:9%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.celda .obj svg{width:100%;height:100%;display:block}
.etis{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));pointer-events:none;z-index:4}
.etis .eti{align-self:end;justify-self:center;margin-bottom:3px;max-width:calc(100% - 6px);text-align:center;font-style:normal;
  font:700 max(6px,min(calc(var(--cell)*.105),calc((var(--cell)*var(--l) - 10px)/(var(--w)*.78)),calc((var(--cell)*var(--l) - 10px)*2/(var(--t)*.78))))/1.08 var(--txt);
  letter-spacing:.05em;text-transform:uppercase;background:rgba(20,16,44,.86);color:#fff;padding:3px 5px 2px;border-radius:4px;overflow-wrap:normal}
.celda .x{z-index:4;display:grid;place-items:center;font:400 calc(var(--cell)*.3) var(--pix);color:#fff;text-shadow:2px 2px 0 rgba(20,16,44,.9);opacity:0;transform:scale(.3);transition:.14s}
.celda.marca .x{opacity:.92;transform:none}
.celda .vista{z-index:2;opacity:0;transition:opacity .25s;background:repeating-linear-gradient(135deg,rgba(18,14,40,.42) 0 3px,transparent 3px 9px)}
.celda.vista-on .vista{opacity:1}
.celda.bloq{cursor:not-allowed}
.celda:not(.bloq):hover::after{content:"";position:absolute;inset:3px;border:2px dashed rgba(255,255,255,.85);border-radius:8px;z-index:6;pointer-events:none}
.celda.tiembla{animation:tiembla .3s}
@keyframes tiembla{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.celda .notas{z-index:5}
.celda .notas b{position:absolute;min-width:calc(var(--cell)*.27);height:calc(var(--cell)*.27);display:none;place-items:center;font:400 calc(var(--cell)*.14)/1 var(--pix);
  background:var(--c);color:#14102c;border-radius:5px;box-shadow:0 0 0 1.5px #14102c;padding:1px 2px 0 3px}
.celda .notas b.on{display:grid}
.celda .notas b:nth-child(1){left:4px;top:4px}.celda .notas b:nth-child(2){right:4px;top:4px}
.celda .notas b:nth-child(3){left:4px;bottom:4px}.celda .notas b:nth-child(4){right:4px;bottom:4px}
.celda.ocupada .notas{display:none}

/* pisos */
.p-lab{background:conic-gradient(#cfe6ea 25%,#eaf6f7 0 50%,#cfe6ea 0 75%,#eaf6f7 0) 0 0/50% 50%}
.p-biblio{background:repeating-linear-gradient(90deg,#b98450 0 23%,#9a6a3c 23% 25%),#b98450}
.p-jardin{background:radial-gradient(circle at 22% 30%,#9be07a 0 5%,transparent 6%),radial-gradient(circle at 70% 64%,#4ea648 0 6%,transparent 7%),radial-gradient(circle at 46% 86%,#9be07a 0 4%,transparent 5%),radial-gradient(circle at 84% 18%,#4ea648 0 4%,transparent 5%),linear-gradient(135deg,#74c95e,#62b852)}
.p-descanso{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.16) 0 12%,transparent 13%) 0 0/50% 50%,linear-gradient(135deg,#8f6cc9,#7654b4)}
.p-cocina{background:conic-gradient(#f7e9d0 25%,#e59a78 0 50%,#f7e9d0 0 75%,#e59a78 0) 0 0/50% 50%}
.p-arena{background:radial-gradient(circle at 25% 35%,#c9b071 0 4%,transparent 5%),radial-gradient(circle at 72% 70%,#fff3c9 0 4%,transparent 5%),linear-gradient(135deg,#ecd9a2,#dfc888)}
.p-piedra{background:linear-gradient(90deg,transparent 48%,rgba(0,0,0,.18) 48% 52%,transparent 52%) 0 0/100% 50%,linear-gradient(0deg,transparent 47%,rgba(0,0,0,.18) 47% 53%,transparent 53%),linear-gradient(135deg,#9a98a6,#7f7d8c)}
.p-metal{background:radial-gradient(circle at 12% 12%,#5d6b82 0 5%,transparent 6%),radial-gradient(circle at 88% 12%,#5d6b82 0 5%,transparent 6%),radial-gradient(circle at 12% 88%,#5d6b82 0 5%,transparent 6%),radial-gradient(circle at 88% 88%,#5d6b82 0 5%,transparent 6%),linear-gradient(135deg,#b4c2d6,#93a3ba)}
.p-casino{background:radial-gradient(circle at 50% 50%,#ffd23f 0 7%,transparent 8%) 0 0/50% 50%,linear-gradient(135deg,#b3243e,#8a1730)}
.p-torre{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.12) 0 4%,transparent 5%),radial-gradient(circle at 75% 70%,rgba(255,255,255,.1) 0 3%,transparent 4%),linear-gradient(135deg,#4d4470,#372f57)}
.p-hielo{background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.7) 40% 44%,transparent 44% 60%,rgba(255,255,255,.5) 60% 62%,transparent 62%),linear-gradient(135deg,#bfeaf7,#8fd0ea)}
.agua{background:linear-gradient(160deg,#35b6f2,#1b7fd6)!important}
.agua .fx{z-index:1;background:
  radial-gradient(ellipse 30% 9% at 30% 30%,rgba(255,255,255,.75) 0 60%,transparent 62%),
  radial-gradient(ellipse 24% 8% at 72% 62%,rgba(255,255,255,.55) 0 60%,transparent 62%),
  radial-gradient(ellipse 18% 6% at 40% 84%,rgba(255,255,255,.45) 0 60%,transparent 62%);animation:ola 3.2s ease-in-out infinite alternate}
@keyframes ola{from{transform:translateX(-9%)}to{transform:translateX(9%)}}

/* fichas */
.ficha{--c:#888;position:relative;border-radius:50%;display:block;flex:none;
  background:radial-gradient(circle at 34% 26%,#fff 0 6%,color-mix(in srgb,var(--c) 55%,#fff) 20%,var(--c) 62%,color-mix(in srgb,var(--c) 60%,#000) 100%);
  box-shadow:0 0 0 3px #fff,0 0 0 5px #1d1933,0 6px 10px rgba(0,0,0,.45)}
.ficha svg{position:absolute;inset:9%;width:82%;height:82%}
.celda .tok{z-index:5;display:grid;place-items:center}
.celda .tok .ficha{width:72%;height:72%;animation:cae .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes cae{from{transform:translateY(-60%) scale(.3);opacity:0}}
.celda.choque .ficha{box-shadow:0 0 0 3px #fff,0 0 0 6px #ff1f3d,0 0 18px 6px #ff1f3d;animation:tiembla .3s}
.celda .ficha.victima::after{content:var(--ko,"K.O.");position:absolute;right:-18%;top:-16%;font:400 max(6px,calc(var(--cell)*.1)) var(--pix);background:#1d1933;color:#ffd23f;padding:3px 3px 2px 4px;border-radius:4px;transform:rotate(10deg)}

.mando{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{font:600 14px var(--txt);letter-spacing:.03em;padding:10px 14px 9px;border-radius:12px;color:#fff;
  background:linear-gradient(180deg,#3d5af1,#2238b8);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 4px 0 #111a5c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 1px 0 #111a5c}
.btn.osc{background:linear-gradient(180deg,#3a3550,#221f36);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 0 #0e0c1c}
.btn.ama{background:linear-gradient(180deg,#ffe066,#f2b10c);color:#3a2500;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #8a6200}

/* panel derecho (compacto) */
.lado{display:flex;flex-direction:column;min-width:0;max-height:calc(var(--cell) * var(--n) + 104px)}
@media (max-width:900px){.lado{max-height:none}}
.lcd{background:linear-gradient(180deg,var(--lcd2),var(--lcd));border-radius:14px;padding:10px;position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2c6b5f transparent;
  box-shadow:inset 0 0 0 3px #071310, inset 0 6px 30px rgba(0,0,0,.8), 0 4px 0 rgba(255,255,255,.2)}
.lcd h3{font:400 9px var(--pix);color:var(--fosforo);margin:2px 2px 9px;text-shadow:0 0 10px var(--fosforo);display:flex;justify-content:space-between;gap:8px}
.lcd h3 em{font-style:normal;opacity:.65}
.testigos{display:grid;gap:5px}
.tes{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;text-align:left;width:100%;
  padding:5px 8px 5px 7px;border-radius:11px;background:rgba(125,255,176,.06);border:2px solid rgba(125,255,176,.16);transition:.16s;position:relative}
.tes .ficha{width:32px;height:32px;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #071310}
.tes strong{font:400 8px var(--pix);color:#fff;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tes strong i{font-style:normal;background:var(--c);color:#14102c;padding:2px 3px 1px 4px;border-radius:4px}
.tes strong u{text-decoration:none;font:700 9px var(--txt);letter-spacing:.12em;background:#ffd23f;color:#3a2500;padding:1px 5px;border-radius:4px}
.tes p{margin:3px 0 0;font-size:12.5px;line-height:1.2;color:#cfeedd}
.tes p b{color:var(--oro);font-weight:600}
.tes:hover{background:rgba(125,255,176,.12)}
.tes.sel{border-color:var(--oro);background:rgba(255,210,63,.14);box-shadow:0 0 0 3px rgba(255,210,63,.25),0 0 30px rgba(255,210,63,.25)}

(() => {
const K = window.COARTADA, A = window.COARTADA_ARTE;

const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

/* ---------- Guardado (por navegador) ---------- */
const LS = 'coartada3d.v1';
let store = { casos: {}, mus: true, sfx: true, vol: .7 };
try { const g = JSON.parse(localStorage.getItem(LS)); if (g && g.casos) store = Object.assign(store, g); } catch (e) {}
const persistir = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
// huella de cada caso: si un caso se rehace, el avance guardado de la versión anterior ya no sirve y se descarta
const firma = (c) => { const s = JSON.stringify([c.rooms, c.objs, c.personajes]); let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; };
for (const c of K.CASOS) { const s = store.casos[c.id]; if (s && s.firma !== firma(c)) delete store.casos[c.id]; }
const nuevoEstado = (c) => ({ firma: firma(c), pos: {}, marcas: {}, notas: {}, pistaMax: 0, seg: 0, fin: false, vio: false, estrellas: 0 });

/* ---------- Audio: dos canales independientes (música y efectos) ---------- */
let ctx = null, busMus = null, busSfx = null;
const VOL_MUS = .55;

  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();

  if (!ctx) return;
  const t = ctx.currentTime;
  busMus.gain.cancelScheduledValues(t); busMus.gain.setValueAtTime(store.mus ? VOL_MUS * store.vol : 0, t);
  busSfx.gain.cancelScheduledValues(t); busSfx.gain.setValueAtTime(store.sfx ? store.vol : 0, t);

  pon: () => { bip(660, .06); bip(990, .09, 'square', .05, .06); },

  }
  st.fin = true; st.vio = false; st.estrellas = st.pistaMax === 0 ? 3 : st.pistaMax <= Math.ceil(pistas.length / 3) ? 2 : 1;
  sel = null; pintar(); marcarEscena(); cerrarPista(); $('#aviso').classList.remove('on');
  bip(110, .9, 'sawtooth', .05);
  setTimeout(() => { S.gana(); confeti(); final(false); }, 1500);
}
function verSolucion() {
  st.pos = JSON.parse(JSON.stringify(caso.sol)); st.marcas = {}; st.fin = true; st.vio = true; st.estrellas = 0; sel = null;
  cerrarPista(); pintar(); marcarEscena(); final(true);
}
function reiniciar() {
  store.casos[caso.id] = st = nuevoEstado(caso); sel = null; hist = [];
  cerrarPista(); cerrarPicker(); pintar(); marcarEscena(); reloj();
}

/* ---------- Pistas (las genera el solver lógico: siempre coherentes con el caso) ---------- */
// personalidad del mundo actual (narrador, frases, celebración); si un mundo no tiene, se usa un narrador neutro
const NEUTRO = { intro: 'Recuerda: <b>una habitación puede quedar vacía</b> y otra puede tener a varios. Parte por las coartadas que dejan menos casillas posibles y ve descartando filas y columnas. La víctima se ubica al final.',
  mira: (n) => `Fíjate en ${n}: con lo que ya se puede saber, le queda <b>una sola casilla</b> posible.`, va: (n, d) => `${n} va en ${d}.`,
  victima: (n, d) => `Ya ubicaste a todos los sospechosos: a ${n} le queda la única fila y columna libres, ${d}. ¿Quién comparte esa habitación?`,
  falta: (k) => `Aún faltan <b>${k}</b> por ubicar. Toca una coartada y luego una casilla del tablero.`,
  falla: (k) => `Algo no calza: <b>${k} ${k === 1 ? 'ubicación contradice' : 'ubicaciones contradicen'}</b> las coartadas o comparten fila/columna. Están marcadas en rojo.`,
  gana: '', revela: '', frases: {}, confeti: ['#ffd23f', '#e3172f', '#4be3ff', '#5cf08a', '#fff', '#b46cff'] };
const mundo = (tema) => Object.assign({}, NEUTRO, (window.COARTADA_MUNDOS || {})[tema || (caso && caso.tema)] || {});
const voz = (txt) => { const M = mundo(); return M.narrador ? `<div class="voz">${ficha(M.narrador)}<p>${txt}</p></div>` : txt; };
function armarPistas(c) {
  const lg = K.resolverLogico(c), vic = c.personajes.find((p) => p.victima).id, M = mundo(c.tema);
  const out = [M.intro];
  for (const p of lg.pasos) {
    const n = `<b>${pj(p.id).nombre}</b>`, donde = `<b>${K.celdaNombre(p.r, p.c)}</b> (${c.salas[K.roomAt(c, p.r, p.c)].nombre})`;
    if (p.id === vic) { out.push(M.victima(n, donde)); continue; }
    out.push(M.mira(n));
    const corta = (l) => l.length <= 6 ? l.join(', ') : l.slice(0, 5).join(', ') + ` y ${l.length - 5} más`;
    const intro = p.inicial.length <= 10 ? `Su coartada lo deja en <b>${p.inicial.join(', ')}</b>.` : `Su coartada lo deja en <b>${p.inicial.length} casillas</b>.`;
    out.push(!p.descartes.length ? `${M.va(n, donde)} Es la única casilla que cumple su coartada.` : `${M.va(n, donde)}<br><small>${intro} Por qué se descarta cada otra:</small>` +
      `<ul>${p.descartes.map((d) => `<li><b>${corta(d.celdas)}</b>: ${d.razon}.</li>`).join('')}</ul>`);
  }
  return out;
}
function mostrarPista(i) {
  pistaIdx = Math.max(0, Math.min(pistas.length - 1, i));
  if (pistaIdx + 1 > st.pistaMax && pistaIdx > 0) { st.pistaMax = pistaIdx + 1; persistir(); }
  const M = mundo();
  $('#pTit').textContent = `PISTA ${pistaIdx + 1} DE ${pistas.length}`;
  $('#pNarra').innerHTML = M.narrador ? `${ficha(M.narrador)}<span>${M.titulo}</span>` : '';
  $('#pNarra').hidden = !M.narrador;
  $('#pTxt').innerHTML = pistas[pistaIdx];
  $('#pAnt').disabled = pistaIdx === 0; $('#pSig').disabled = pistaIdx === pistas.length - 1;
  $('#pista').classList.add('on');
}
function cerrarPista() { $('#pista').classList.remove('on'); }
$('#pAnt').onclick = () => { S.sel(); mostrarPista(pistaIdx - 1); };
$('#pSig').onclick = () => { S.sel(); mostrarPista(pistaIdx + 1); };
$('#pCerrar').onclick = cerrarPista;

/* ---------- Modales ---------- */
const velo = $('#velo');
function cerrarVelo() { velo.classList.remove('on'); velo.innerHTML = ''; }
function expediente() {
  velo.innerHTML = `<div class="exp"><small>Expediente N.º ${String(caso.numero).padStart(3, '0')} · ${caso.lugar}</small><h2>${caso.titulo}</h2>
    <p>${caso.historia}</p>
    <p class="nota"><b>Tu misión:</b> ubica a los ${caso.personajes.length} en el plano. Quien haya estado <b>a solas con la víctima en la misma habitación</b> es el culpable. Ojo: una habitación puede quedar vacía.</p>
    <div class="fila"><button class="btn osc" id="mReglas">¿Cómo se juega?</button><button class="btn" id="mIr">Empezar a investigar ▶</button></div></div>`;
  velo.classList.add('on');
  $('#mIr').onclick = () => { cerrarVelo(); S.sel(); };
  $('#mReglas').onclick = () => reglas(true);
}
function reglas(volver) {
  velo.innerHTML = `<div class="exp sin"><small>Manual del detective</small><h2>Reglas</h2>
    <ol>
      <li>En <b>cada fila y cada columna</b> hay exactamente <b>un</b> personaje.</li>
      <li>Nadie puede estar en una casilla con <b>muebles</b> (los que dicen “bloquean”). Sí se puede sobre colchonetas, alfombras, hierba alta y dentro del agua.</li>
      <li>Las líneas gruesas son paredes: separan las <b>habitaciones</b>. Una habitación puede quedar <b>vacía</b> o tener a <b>varios</b> personajes.</li>
      <li>Todos los sospechosos dicen la verdad. <b>“Al lado”</b> = comparte un lado de la casilla <b>dentro de la misma habitación</b> (en diagonal no cuenta, y a través de una pared tampoco). <b>Norte</b> es arriba.</li>
      <li>La <b>víctima no tiene coartada</b>: ocupa la casilla que sobre al final. El <b>culpable</b> es quien estaba <b>a solas con ella</b> en su habitación.</li>
    </ol>
    <p class="nota"><b>Controles:</b> toca una coartada y luego una casilla para ubicar a ese personaje; toca una ficha para levantarla. Toca el <b>centro</b> de una casilla vacía para marcarla con ✕. Toca una <b>esquina</b> para anotar la inicial de un sospechoso (tócala de nuevo para borrarla). Las casillas rayadas ya están “vistas” por alguien en su fila o columna.</p>
    <div class="fila"><button class="btn" id="mOk">Entendido</button></div></div>`;
  velo.classList.add('on');
  $('#mOk').onclick = () => (volver ? expediente() : cerrarVelo());
}
function confirmar(titulo, texto, si, fn) {
  velo.innerHTML = `<div class="exp sin"><small>Confirmar</small><h2>${titulo}</h2><p>${texto}</p>
    <div class="fila"><button class="btn osc" id="mNo">Cancelar</button><button class="btn" id="mSi">${si}</button></div></div>`;
  velo.classList.add('on');
  $('#mNo').onclick = cerrarVelo; $('#mSi').onclick = () => { cerrarVelo(); fn(); };
}
function final(revelada) {
  const culp = K.culpable(caso, st.pos), vic = caso.personajes.find((x) => x.victima);
  const sig = null, M = mundo(), frase = M.frases[culp];
  velo.innerHTML = `<div class="final"><div class="rayos"></div>${!revelada && M.celebra ? celebracion(M.celebra) : ''}<h2>${revelada ? 'SOLUCIÓN REVELADA' : '¡CASO RESUELTO!'}</h2>
    <div class="acusado">${ficha(culp)}${frase ? `<q>${frase}</q>` : ''}</div>
    <div class="culp">Fue <span>${pj(culp).nombre.toUpperCase()}</span></div>
    <p>A solas con ${pj(vic.id).nombre} (${caso.salas[K.roomAt(caso, ...st.pos[vic.id])].nombre}). ${caso.movil}</p>
    ${(revelada ? M.revela : M.gana) ? `<div class="dicho">${voz(revelada ? M.revela : M.gana)}</div>` : ''}
    ${revelada ? '' : `<div class="est">${'★'.repeat(st.estrellas)}<i>${'★'.repeat(3 - st.estrellas)}</i></div><div class="dat">TIEMPO ${mmss(st.seg)} · PISTAS VISTAS ${st.pistaMax}</div>`}
    <div class="fila"><button class="btn osc" id="fVer">Ver el tablero</button>${sig ? '<button class="btn ama" id="fSig">Siguiente caso ▶</button>' : ''}</div></div>`;
  velo.classList.add('on');
  $('#fVer').onclick = cerrarVelo;
    if (sig) $('#fSig').onclick = () => { cerrarVelo(); transicion(() => abrirCaso(sig)); };
}
let avisoT = null;
function aviso(html, tit) {
  const a = $('#aviso'); a.innerHTML = (tit ? `<small>${tit}</small>` : '') + html; a.classList.add('on');
  clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove('on'), 6000);
}
$('#aviso').onclick = () => $('#aviso').classList.remove('on');
// celebración propia de cada mundo (sobre el título del final)
function celebracion(tipo) {
  const svg = {
    dundie: `<svg viewBox="0 0 120 120"><ellipse cx="60" cy="112" rx="34" ry="5" fill="rgba(0,0,0,.35)"/><rect x="34" y="92" width="52" height="16" rx="3" fill="#3a2a1a"/><rect x="40" y="96" width="40" height="7" rx="1" fill="#c9a227"/><text x="60" y="102.500" text-anchor="middle" font-size="6" font-family="monospace" fill="#3a2a1a" font-weight="bold">DUNDIE</text><path d="M48 92l4-34q8-10 16 0l4 34z" fill="#ffd23f" stroke="#b88a10" stroke-width="2"/><circle cx="60" cy="40" r="11" fill="#ffd23f" stroke="#b88a10" stroke-width="2"/><path d="M50 62L34 38M70 62l16-24" stroke="#ffd23f" stroke-width="7" stroke-linecap="round"/><rect x="26" y="26" width="18" height="10" rx="2" fill="#ffd23f" stroke="#b88a10" stroke-width="1.500" transform="rotate(-25 35 31)"/><path d="M56 47q4 3 8 0" stroke="#b88a10" stroke-width="1.500" fill="none"/></svg>`,
    esferas: `<svg viewBox="0 0 120 120">${[0, 1, 2, 3, 4, 5, 6].map((i) => { const a = i / 7 * Math.PI * 2 - Math.PI / 2, x = 60 + Math.cos(a) * 42, y = 60 + Math.sin(a) * 42; return `<g class="bola" style="--i:${i}"><circle cx="${x}" cy="${y}" r="11" fill="#ffab2e" stroke="#d9780c" stroke-width="1.500"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${i > 3 ? 6 : 8}" fill="#d1201a">${'★'.repeat(i + 1).slice(0, 4)}</text></g>`; }).join('')}<circle cx="60" cy="60" r="16" fill="rgba(120,255,140,.25)"/></svg>`,
    licencia: `<svg viewBox="0 0 120 120"><g transform="rotate(-6 60 60)"><rect x="12" y="28" width="96" height="62" rx="7" fill="#1d3b2c" stroke="#c9a227" stroke-width="3"/><rect x="20" y="38" width="28" height="34" rx="3" fill="#e8e4d4"/><circle cx="34" cy="50" r="7" fill="#c8a080"/><path d="M24 70q10-12 20 0z" fill="#3a5a8a"/><path d="M56 42h42M56 52h34M56 62h38" stroke="#9fd8b4" stroke-width="3" stroke-linecap="round"/><text x="78" y="84" text-anchor="middle" font-size="10" font-family="Russo One,sans-serif" fill="#ffe9a8">HUNTER</text></g><g class="sello"><circle cx="86" cy="80" r="22" fill="none" stroke="#e3172f" stroke-width="4"/><text x="86" y="84" text-anchor="middle" font-size="10" font-weight="bold" font-family="sans-serif" fill="#e3172f" transform="rotate(-18 86 80)">APROBADO</text></g></svg>`,
    rosquilla: `<svg viewBox="0 0 120 120"><g class="gira"><circle cx="60" cy="60" r="40" fill="#d9a05a"/><circle cx="60" cy="58" r="36" fill="#ff7ab0"/><circle cx="60" cy="60" r="13" fill="#2a1a40"/>${[[34, 44, 20], [48, 30, -30], [74, 32, 60], [86, 52, 10], [82, 76, -50], [62, 86, 30], [40, 78, 70], [30, 60, -10]].map(([x, y, r], i) => `<rect x="${x}" y="${y}" width="9" height="3" rx="1.500" fill="${['#ffd23f', '#4fb3f6', '#fff', '#7ac850'][i % 4]}" transform="rotate(${r} ${x} ${y})"/>`).join('')}<path d="M36 48q6-14 22-18" stroke="#fff" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/></g></svg>`,
    anillo: `<svg viewBox="0 0 120 120"><path d="M20 112q8-30 18-14q6-26 14-6q8-30 16-4q8-22 14 4q10-18 18 20z" fill="#ff7a1a"/><path d="M30 112q6-18 12-8q6-16 12-2q6-18 12-2q6-12 12 4q6-8 10 8z" fill="#ffd23f"/><g class="cae"><ellipse cx="60" cy="40" rx="20" ry="8" fill="none" stroke="#ffcf4a" stroke-width="7"/><ellipse cx="60" cy="40" rx="20" ry="8" fill="none" stroke="#fff3b0" stroke-width="2" stroke-dasharray="6 10"/></g></svg>`,
  }[tipo];
  return svg ? `<div class="celebra c-${tipo}">${svg}</div>` : '';
}
function confeti() {
  const col = mundo().confeti;
  for (let i = 0; i < 90; i++) {
    const c = el('i', 'confeti');
    c.style.cssText = `left:${Math.random() * 100}vw;background:${col[i % col.length]};--d:${2 + Math.random() * 2.5}s;--x:${(Math.random() - .5) * 240}px;--r:${(Math.random() - .5) * 1400}deg;animation-delay:${Math.random() * .8}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 6000);
  }
}

/* ---------- Botones ---------- */
$('#bAcusar').onclick = acusar;
$('#bDeshacer').onclick = () => { if (st.fin || !hist.length) return S.no(); const h = JSON.parse(hist.pop()); st.pos = h.pos; st.marcas = h.marcas; st.notas = h.notas; sel = null; S.quita(); cerrarPicker(); pintar(); };
$('#bReiniciar').onclick = () => confirmar('¿Reiniciar el caso?', 'Se borrará <b>todo lo guardado de este caso</b>: fichas, marcas, notas, tiempo, pistas vistas y resultado.', 'Sí, reiniciar', reiniciar);
$('#bReglas').onclick = () => reglas(false);
$('#bPista').onclick = () => { if (st.fin) return; S.sel(); mostrarPista($('#pista').classList.contains('on') ? pistaIdx : Math.max(0, st.pistaMax - 1)); };
$('#bSolucion').onclick = () => {
  if (st.fin) return final(st.vio);
  confirmar('¿Ver la solución?', 'Se ubicará a todos los personajes en su lugar y el caso quedará marcado como <b>“solución vista”</b> (sin estrellas). Puedes volver a intentarlo con Reiniciar.', 'Mostrar solución', verSolucion);
};
const pintaAudio = () => { $('#bMusica').classList.toggle('off', !store.mus); $('#bSonido').classList.toggle('off', !store.sfx); };
// regulador de volumen (música y efectos a la vez); se guarda en este navegador
$('#vol').value = Math.round(store.vol * 100);
$('#vol').oninput = (e) => { store.vol = e.target.value / 100; audio(); aplicarVolumen(); Musica.volumen(); $('.vol span').textContent = store.vol === 0 ? '🔇' : store.vol < .5 ? '🔈' : '🔉'; };
$('#vol').onchange = () => { persistir(); S.sel(); };
$('#bMusica').onclick = alternarMusica;
$('#bSonido').onclick = alternarSonido;
$('#bSalir').onclick = () => { S.sel(); expediente(); };
$('#vInclinada').onclick = () => { S.sel(); T3.vista('inclinada'); };
$('#vCenital').onclick = () => { S.sel(); T3.vista('cenital'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && caso && !st.fin) { sel = null; cerrarPicker(); pintar(); } });
addEventListener('beforeunload', persistir);

/* ---------- Cielo de píxeles ---------- */
(function cielo() {
  const cv = $('#cielo'), c = cv.getContext('2d'); let W, H, ps = [];
  const col = ['#4be3ff', '#ffd23f', '#ff5468', '#ffffff', '#b46cff'];
  function tam() { W = cv.width = innerWidth; H = cv.height = innerHeight; ps = Array.from({ length: Math.round(W * H / 16000) }, () => nuevo(true)); }
  function nuevo(inic) { return { x: Math.random() * W, y: inic ? Math.random() * H : H + 10, s: 2 + Math.floor(Math.random() * 3) * 2, v: .15 + Math.random() * .5, c: col[Math.floor(Math.random() * col.length)], f: Math.random() * 6.28 }; }
  function paso(t) {
    c.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.y -= p.v; p.x += Math.sin(t / 1800 + p.f) * .25;
      if (p.y < -10) Object.assign(p, nuevo(false));
      c.globalAlpha = .25 + .45 * Math.abs(Math.sin(t / 900 + p.f)); c.fillStyle = p.c; c.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    }
    requestAnimationFrame(paso);
  }
  addEventListener('resize', tam); tam(); requestAnimationFrame(paso);
})();

pintaAudio(); abrirCaso(K.CASOS.find((c) => c.id === 'office-02'));
window.__coartada = { abrir: (n) => abrirCaso(K.CASOS[n || 0]), estado: () => st, caso: () => caso, pistas: () => pistas, musica: Musica };
})();
</script>
